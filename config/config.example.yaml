# RadioPlayer configuration.
#   Docker:   config.yaml on the "config" volume (created from this file on
#             first start), or in the folder given as CONFIG_DIR
#   systemd:  /etc/radioplayer/config.yaml
#
# With Docker, environment variables override this file: MQTT_HOST,
# AUDIO_DEVICE and the others listed in compose.yaml, or any setting as
# RADIOPLAYER__SECTION__KEY.
#
# After editing, restart the stack (a few seconds of silence on air). To
# validate first:  radioplayer check   (in the engine container)

music:
  # Where the SMB share is mounted (see /etc/systemd/system/mnt-radio.mount).
  root: /mnt/radio

  # Every top-level folder on the share becomes a playlist automatically.
  # Add a folder on the share, press "Rescan music library" in Home
  # Assistant, and it appears in the playlist dropdown.
  auto_playlists: true

  # Top-level folders to NOT turn into playlists (case-insensitive).
  exclude: []
  #  - "#recycle"
  #  - Station IDs

  # Extra playlists made from one or more folders (relative to root, or
  # absolute). With several folders, each song is picked from a random
  # folder, so each folder gets an equal share of airtime regardless of size.
  playlists: []
  #  - name: Holiday Mix
  #    folders: [Christmas, Winter]
  #  - name: Oldies
  #    folder: Decades/60s

  # A playlist of the whole share. Set to null to hide it.
  all_playlist_name: All Music

  # Playlist to use on first start (afterwards the last selection is kept).
  default_playlist: null

  # If the selected playlist has nothing playable, play the whole share,
  # then the local emergency folder below.
  fallback_to_all: true

  # Local mirror: copy the WHOLE share to local disk and always play from
  # the copy. A NAS or network outage then has no effect on air. Recommended
  # whenever the library fits on the local disk. The share is re-checked
  # every interval_minutes and when "Rescan music library" is pressed; new
  # and changed files are copied, files removed from the share are removed
  # (never when the share is unreachable or looks mostly empty).
  # With the mirror on, the emergency folder below is not used.
  mirror:
    enabled: false
    dir: /var/lib/radioplayer/library
    interval_minutes: 15

  # Local copy of some music on local disk, used when the share is down.
  # Filled at first start, then refreshed with a new random selection every
  # emergency_refresh_days (0 = never; fill it by hand instead). With a
  # small library, raise emergency_max_mb so the whole library fits.
  emergency_dir: /var/lib/radioplayer/emergency
  emergency_refresh_days: 7
  emergency_max_mb: 2000

  # How often folders are re-read for added/removed files.
  reload_minutes: 60

  # Skip a song that contains this many seconds of silence (hidden tracks).
  max_blank_seconds: 10

output:
  # alsa: sound card. (dummy / wav are for testing.)
  type: alsa
  # List devices with:  aplay -L | grep -A1 ^plughw
  # Find the card name with `aplay -l` on the host ("card 1: Audio [...]"
  # gives CARD=Audio). It varies between sound cards.
  #   USB sound card:                  plughw:CARD=Audio,DEV=0
  #   Raspberry Pi built-in 3.5 mm:    plughw:CARD=Headphones,DEV=0
  device: "plughw:CARD=Audio,DEV=0"

  # Output level, in dB, set from Home Assistant. Applied after the limiter,
  # so it never makes peaks louder than the ceiling.
  default_volume_db: -6.0
  min_volume_db: -40.0
  # Hard upper limit for the Home Assistant slider. Set this during
  # calibration (see README) so nobody can overdrive the modulator.
  max_volume_db: 0.0

  # Sound card buffer in seconds (Liquidsoap 2.3+). null = from the engine
  # profile below (1.0 low-CPU, 0.25 otherwise). Raise it if the engine log
  # shows "Underrun!" (crackles/dropouts); it delays controls by that much.
  alsa_buffer_seconds: null

  # Highest sample level the processing will ever output (dBFS).
  ceiling_db: -1.0

  # Crossfade between songs (0 to disable).
  crossfade_seconds: 2.0

processing:
  # How much processing to run. Measured share of one CPU core on a Pi 3B
  # (Liquidsoap 2.3), approximately:
  #   full     4-band compressor, AGC, EQ        ~105%  (too much; Pi 4/5 only)
  #   lite     1-band compressor, AGC, EQ                 ~65-70%
  #   minimal  no AGC/EQ/compressor; keeps limiter, filters,
  #            pre-emphasis protection and ceiling          ~55%
  # If the engine log shows "Underrun!" or "catchup", step down a mode.
  # On a PC, server or Raspberry Pi 4/5 use full; on a Pi 3B, lite.
  mode: full

  # Preset on first start: flat, light, medium or heavy (or one of yours).
  # Quote it if you name a preset "off"/"on"/"yes"/"no" (YAML reads those
  # as true/false).
  default_preset: medium

  # Pre-emphasis protection: limit the audio as the transmitter will see it
  # after its treble boost, so cymbals and "s" sounds can't over-deviate.
  # 75 = Americas (standard for US FM), 50 = Europe/elsewhere, 0 = off.
  # If unsure, leave 75: if the modulator turns out not to pre-emphasize,
  # the only effect is slightly reined-in treble on the brightest moments.
  preemphasis_us: 75

  # Slow automatic gain control so quiet and loud recordings even out.
  agc: true
  agc_target_db: -16.0

  # The ZFMSM passes 30 Hz - 15 kHz. Keep lowpass_hz at or below 15000 so
  # nothing lands on the 19 kHz stereo pilot.
  highpass_hz: 30.0
  lowpass_hz: 15000.0

  # Compressor band edges (Hz): low | low-mid | high-mid | high.
  crossovers: [150.0, 800.0, 5000.0]

  # Override or add presets. Values in dB except ratio.
  #   bass / presence / air: EQ at 80 Hz / 3 kHz / 10 kHz (all modes but minimal)
  #   drive, limiter_drive: how hard the compressor and limiter are pushed
  #   bands: the 4-band compressor (full mode): low, low-mid, high-mid, high
  #   wideband: the single compressor (lite mode)
  # Only the values you list are changed; the rest keep their defaults.
  presets: {}
  #  medium:
  #    bass: 1.0
  #    presence: 2.0
  #    air: 2.0
  #  talk:
  #    drive: 2.0
  #    bass: 0.0
  #    presence: 2.0
  #    air: 0.0
  #    bands:
  #      - {threshold: -24, ratio: 3, gain: 3}
  #      - {threshold: -24, ratio: 3, gain: 4}
  #      - {threshold: -24, ratio: 3, gain: 4}
  #      - {threshold: -28, ratio: 4, gain: 2}

engine:
  # Latency/CPU trade-off.
  #   true   large audio frames and buffers: least CPU, skips heard after 2-4 s
  #   false  small ones: skips heard after about a second
  #   auto   true on ARM boards (Raspberry Pi), false on PCs and servers
  low_cpu: auto

# Local control API used by the bridge and the CLI. It has no password:
# keep it on localhost. (With Docker, compose.yaml sets bind and host so the
# two containers reach each other on the stack's private network.)
http:
  bind: 127.0.0.1
  port: 8005

mqtt:
  # Your Home Assistant MQTT broker (e.g. the Mosquitto add-on). With
  # Docker, use a DNS name or IP address; .local names don't resolve there.
  host: homeassistant.local
  port: 1883
  username: radioplayer
  password: CHANGE_ME
  tls: false
  base_topic: radioplayer
  discovery_prefix: homeassistant
  device_name: FM Radio Player
