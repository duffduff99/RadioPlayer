# RadioPlayer with Docker Compose. See "Install with Docker" in README.md.
#
#   cp config/config.example.yaml config.yaml   # then edit it
#   docker compose up -d            # pulls the published image
#   docker compose up -d --build    # or build it from this checkout
#
# Settings you can override in a .env file or the stack's environment:
#   RADIOPLAYER_IMAGE  image to run     (default ghcr.io/duffduff99/radioplayer:latest)
#   CONFIG_FILE        config.yaml path (default ./config.yaml; use an absolute
#                      path when the stack is deployed from a UI such as Dockhand)
#   MUSIC_DIR          music share mount on the host (default /mnt/radio)
#
# The SMB share is mounted on the host at /mnt/radio (or MUSIC_DIR), not by
# Docker: if Docker mounted it and the server were down at boot, the engine
# container could not start at all, and there would be no emergency music.

x-radioplayer: &radioplayer
  build: .
  image: ${RADIOPLAYER_IMAGE:-ghcr.io/duffduff99/radioplayer:latest}
  restart: unless-stopped
  # The engine's control API listens on 127.0.0.1; host networking lets the
  # bridge (and the radioplayer CLI) reach it and the MQTT broker.
  network_mode: host
  volumes:
    - ${CONFIG_FILE:-./config.yaml}:/etc/radioplayer/config.yaml:ro
    - state:/var/lib/radioplayer
    - type: bind
      source: ${MUSIC_DIR:-/mnt/radio}
      target: /mnt/radio
      read_only: true
      bind:
        create_host_path: true
        # Lets the container see the share when the host (auto)mounts it
        # after the container has started.
        propagation: rslave

services:
  engine:
    <<: *radioplayer
    command: engine
    # The sound devices are bind-mounted (see volumes below) rather than
    # listed under "devices", with a cgroup rule allowing all ALSA devices
    # (major 116). That way a USB sound card that is unplugged and plugged
    # back in, or re-attached by a hypervisor, is visible again without
    # recreating the container: the engine exits when the card disappears
    # and is restarted until it can open it again.
    device_cgroup_rules:
      - "c 116:* rmw"
    # Access to /dev/snd. If your host's audio group is not GID 29 (Debian,
    # Raspberry Pi OS and Ubuntu all use 29), put the number from
    # `getent group audio` here instead.
    group_add:
      - "29"
    healthcheck:
      test: ["CMD", "radioplayer", "status"]
      interval: 30s
      timeout: 10s
      start_period: 120s
    # Audio first: a bigger CPU share than the bridge when the host is busy.
    cpu_shares: 2048
    volumes:
      - ${CONFIG_FILE:-./config.yaml}:/etc/radioplayer/config.yaml:ro
      - state:/var/lib/radioplayer
      - type: bind
        source: ${MUSIC_DIR:-/mnt/radio}
        target: /mnt/radio
        read_only: true
        bind:
          create_host_path: true
          propagation: rslave
      - /dev/snd:/dev/snd

  bridge:
    <<: *radioplayer
    command: bridge
    depends_on:
      - engine

volumes:
  # Settings, last playlist/level/preset, playlist cache, and the local
  # music (library mirror or emergency copy).
  state:
