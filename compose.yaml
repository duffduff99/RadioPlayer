# RadioPlayer with Docker Compose. See "Install" in README.md.
#
#   docker compose up -d            # pulls the published image
#   docker compose up -d --build    # or build it from this checkout
#
# Configuration lives in config.yaml on the "config" volume. A documented
# default is created there on first start. The variables below, set in a
# .env file or in a stack manager's environment (Dockhand, Portainer, ...),
# override what is in the file, so a basic setup needs no file editing.
#
#   MQTT_HOST, MQTT_PORT, MQTT_USERNAME, MQTT_PASSWORD   Home Assistant's broker
#   AUDIO_DEVICE     ALSA device, e.g. plughw:CARD=Audio,DEV=0  (see `aplay -l`)
#   MUSIC_ROOT       music folder as seen in the container, e.g. /mnt/radio/Radio
#   MIRROR           true = copy the library to local disk and play from there
#   PROCESSING_MODE  full, lite or minimal
#   MODULATOR        measured corrections for a specific modulator, e.g.
#                    zfmsm-stereo (see MODULATOR_PROFILES in radioplayer/config.py)
#
# Where things are stored:
#   CONFIG_DIR       host folder holding config.yaml, e.g. /opt/radioplayer
#                    (default: the Docker volume "config")
#   MUSIC_DIR        where the music share is mounted on the host (default /mnt/radio)
#   RADIOPLAYER_IMAGE  image to run (default ghcr.io/duffduff99/radioplayer:latest)
#
# The SMB share is mounted on the host, not by Docker: if Docker mounted it
# and the server were down at boot, the engine container could not start.

x-environment: &environment
  RADIOPLAYER__MQTT__HOST: ${MQTT_HOST:-}
  RADIOPLAYER__MQTT__PORT: ${MQTT_PORT:-}
  RADIOPLAYER__MQTT__USERNAME: ${MQTT_USERNAME:-}
  RADIOPLAYER__MQTT__PASSWORD: ${MQTT_PASSWORD:-}
  RADIOPLAYER__OUTPUT__DEVICE: ${AUDIO_DEVICE:-}
  RADIOPLAYER__MUSIC__ROOT: ${MUSIC_ROOT:-}
  RADIOPLAYER__MUSIC__MIRROR__ENABLED: ${MIRROR:-}
  RADIOPLAYER__PROCESSING__MODE: ${PROCESSING_MODE:-}
  RADIOPLAYER__PROCESSING__MODULATOR: ${MODULATOR:-}

x-volumes:
  - &config ${CONFIG_DIR:-config}:/etc/radioplayer
  - &state state:/var/lib/radioplayer
  - &music
    type: bind
    source: ${MUSIC_DIR:-/mnt/radio}
    target: /mnt/radio
    read_only: true
    bind:
      create_host_path: true
      # Lets the container see the share when the host (auto)mounts it
      # after the container has started.
      propagation: rslave

x-radioplayer: &radioplayer
  build: .
  image: ${RADIOPLAYER_IMAGE:-ghcr.io/duffduff99/radioplayer:latest}
  restart: unless-stopped

services:
  engine:
    <<: *radioplayer
    command: engine
    environment:
      <<: *environment
      # The control API has no password. It listens on the stack's private
      # network only (no port is published), where the bridge reaches it.
      RADIOPLAYER__HTTP__BIND: 0.0.0.0
    volumes:
      - *config
      - *state
      - *music
      # The sound devices are bind-mounted rather than listed under
      # "devices", with a cgroup rule allowing all ALSA devices (major 116).
      # That way a USB sound card that is unplugged and plugged back in, or
      # re-attached by a hypervisor, is visible again without recreating
      # the container: the engine exits when the card disappears and is
      # restarted until it can open it again.
      - /dev/snd:/dev/snd
    device_cgroup_rules:
      - "c 116:* rmw"
    # Access to /dev/snd. If your host's audio group is not GID 29 (Debian,
    # Raspberry Pi OS and Ubuntu all use 29), put the number from
    # `getent group audio` here instead.
    group_add:
      - "29"
    healthcheck:
      test: ["CMD", "radioplayer", "status"]
      interval: 30s
      timeout: 10s
      start_period: 120s
    # Audio first: a bigger CPU share than the bridge when the host is busy.
    cpu_shares: 2048

  bridge:
    <<: *radioplayer
    command: bridge
    environment:
      <<: *environment
      RADIOPLAYER__HTTP__HOST: engine
    volumes:
      - *config
      - *state
      - *music
    depends_on:
      - engine

volumes:
  # config.yaml.
  config:
  # Last playlist/level/preset, playlist cache, and the local music
  # (library mirror or emergency copy).
  state:
